# Source: wire-server/templates/background-worker/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "background-worker"
  labels:
    app: background-worker
    chart: wire-server-0.0.42
    release: parity
    heritage: Helm
data:
  background-worker.yaml: |
    logFormat: StructuredJSON
    logLevel: Info

    backgroundWorker:
      host: 0.0.0.0
      port: 8080

    federatorInternal:
      host: federator
      port: 8080

    brig:
      host: brig
      port: 8080
    galley:
      host: galley
      port: 8080

    gundeck:
      host: gundeck
      port: 8080
    spar:
      host: spar
      port: 8080

    postgresqlPool: 
      acquisitionTimeout: 10s
      idlenessTimeout: 10m
      size: 5

    cassandra:
      endpoint:
        host: aws-cassandra
        port: 9042
      keyspace: gundeck
    cassandraBrig:
      endpoint:
        host: aws-cassandra
        port: 9042
      keyspace: brig
    rabbitmq:
      host: rabbitmq
      port: 5672
      vHost: /
      enableTls: false
      insecureSkipVerifyTls: false

    migrateConversations: false
    migrateConversationCodes: false
    migrateTeamFeatures: false
    migrateDomainRegistration: false
    migrateUsers: false
    migrateBlockList: false
    migratePasswordReset: false
    migrationOptions:
      pageSize: 10000
      parallelism: 2
      timeout: 5s

    backendNotificationPusher:
      pushBackoffMaxWait: 300000000
      pushBackoffMinWait: 10000
      remotesRefreshInterval: 300000000
    backgroundJobs:
      concurrency: 8
      jobTimeout: 60s
      maxAttempts: 3
    jobs:
      # Arbiter dispatcher poll interval for all jobs.
      # Lower values reduce discovery latency, but increase DB polling.
      pollInterval: 5s
      # Number of worker threads per job queue.
      workerThreads: 1
      visibilityTimeout: 60s
      jobHeartbeatInterval: 30s
      workerHeartbeatInterval: 10s
      backoffBase: 2
      backoffCap: 86400s
      jitter: equal
      gracefulShutdownTimeout: 30s
      reaperInterval: 300s
      reaperTimeout: 300s
      workerStaleThreshold: 300s
    meetingsCleanup:
      batchSize: 1000
      cleanOlderThanHours: 48
      schedule: 0 * * * *
    postgresMigration:
      blockList: cassandra
      conversation: cassandra
      conversationCodes: cassandra
      domainRegistration: cassandra
      passwordReset: cassandra
      teamFeatures: cassandra
      user: cassandra
