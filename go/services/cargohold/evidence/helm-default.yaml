# Source: wire-server/templates/brig/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "brig"
  labels:
    app: brig
    chart: wire-server-0.0.42
    release: parity
    heritage: Helm
data:
  brig.yaml: |
    logNetStrings: false
    logFormat: StructuredJSON
    logLevel: Info

    randomPrekeys: true

    brig:
      host: 0.0.0.0
      port: 8080

    cassandra:
      endpoint:
        host: aws-cassandra
        port: 9042
      keyspace: brig

    postgresql: 
      dbname: wire-server
      host: postgresql
      port: "5432"
      user: wire-server
    postgresqlPool: 
      acquisitionTimeout: 10s
      idlenessTimeout: 10m
      size: 100
    postgresMigration:
      blockList: cassandra
      conversation: cassandra
      conversationCodes: cassandra
      domainRegistration: cassandra
      passwordReset: cassandra
      teamFeatures: cassandra
      user: cassandra

    elasticsearch:
      url: http://elasticsearch-client:9200
      index: directory
      insecureSkipVerifyTls: false
      additionalInsecureSkipVerifyTls: false

    cargohold:
      host: cargohold
      port: 8080

    galley:
      host: galley
      port: 8080

    spar:
      host: spar
      port: 8080

    gundeck:
      host: gundeck
      port: 8080
    multiSFT: false
    rabbitmq:
      host: rabbitmq
      port: 5672
      vHost: /
      enableTls: false
      insecureSkipVerifyTls: false
    aws:
      prekeyTable: 
      sqsEndpoint: "https://sqs.eu-west-1.amazonaws.com"

    internalEvents:
      queueType: sqs
      queueName: 

    emailSMS:
      email:
        sesQueue: synthetic-events
        sesEndpoint: "https://email.eu-west-1.amazonaws.com"
      general:
        templateDir: /usr/share/wire/templates
        emailSender: 
        smsSender: 
        templateBranding:
          brand: Wire
          brandUrl: https://wire.com
          brandLabelUrl: wire.com
          brandLogoUrl: https://wire.com/p/img/email/logo-email-black.png
          brandService: Wire Service Provider
          copyright: © WIRE SWISS GmbH
          misuse: misuse@wire.com
          legal: https://wire.com/legal/
          forgot: https://wire.com/forgot/
          support: https://support.wire.com/

      user:
        activationUrl: https://example.com/activate?key=${key}&code=${code}
        smsActivationUrl: https://example.com/v/${code}
        passwordResetUrl: https://example.com/password-reset/${key}?code=${code}
        invitationUrl: https://example.com/register?invitation_code=${code}
        deletionUrl: https://example.com/users/delete?key=${key}&code=${code}

      provider:
        homeUrl: https://provider.localhost/
        providerActivationUrl: https://example.com/provider/activate?key=${key}&code=${code}
        approvalUrl: https://example.com/provider/approve?key=${key}&code=${code}
        approvalTo: success@simulator.amazonses.com
        providerPwResetUrl: https://example.com/provider/password-reset?key=\${key}\&code=\${code}

      team:
        tInvitationUrl: https://example.com/register?team=${team}&team_code=${code}
        tActivationUrl: https://example.com/register?team=${team}&team_code=${code}
        tCreatorWelcomeUrl: https://example.com
        tMemberWelcomeUrl: https://example.com
        tExistingUserInvitationUrl: https://example.com/accept-invitation/?team-code=${code}

    zauth:
      privateKeys: /etc/wire/brig/secrets/secretkey.txt
      publicKeys: /etc/wire/brig/secrets/publickey.txt
      authSettings:
        keyIndex: 1
        userTokenTimeout: 4.8384e+06
        sessionTokenTimeout: 86400
        accessTokenTimeout: 900
        providerTokenTimeout: 900
        legalHoldUserTokenTimeout: 4.8384e+06
        legalHoldAccessTokenTimeout: 900
    turn:
      serversSource: files
      servers: /etc/wire/brig/turn/turn-servers.txt
      serversV2: /etc/wire/brig/turn/turn-servers-v2.txt
      secret: /etc/wire/brig/secrets/turn-secret.txt
      configTTL: 3600 # 1 hour
      tokenTTL: 43200 # 12 hours
    sft:
      sftBaseDomain: example.com
    optSettings:
      setActivationTimeout: 1.2096e+06
      setTeamInvitationTimeout: 1.8144e+06
      setUserMaxConnections: 1000
      setCookieInsecure: false
      setUserCookieRenewAge: 1.2096e+06
      setUserCookieLimit: 32
      setUserCookieThrottle:
        stdDev: 3000
        retryAfter: 86400
      setRichInfoLimit: 5000
      setDefaultUserLocale: en
      setMaxTeamSize: 10000
      setMaxConvSize: 500
      setEmailVisibility: visible_to_self
      setPropertyMaxKeyLen: 1024
      setPropertyMaxValueLen: 524288
      setDeleteThrottleMillis: 100
      setFederationDomain: 
      setFederationStrategy: allowNone
      setFederationDomainConfigsUpdateFreq: 10
      # Customer extensions. If this is not part of your contract with wire, use at your own risk!
      # Details: https://github.com/wireapp/wire-server/blob/3a21a82a1781f0d128f503df6a705b0b5f733d7b/services/brig/src/Brig/Options.hs#L465-L503
      set2FACodeGenerationDelaySecs: 300
      setNonceTtlSecs: 300
      setDpopMaxSkewSecs: 1
      setDpopTokenExpirationTimeSecs: 300
      setOAuthAuthCodeExpirationTimeSecs: 300
      setOAuthAccessTokenExpirationTimeSecs: 900
      setOAuthEnabled: true
      setDisabledAPIVersions: ["development"]
      setOAuthRefreshTokenExpirationTimeSecs: 1.45152e+07
      setOAuthMaxActiveRefreshTokens: 10
      setPasswordHashingOptions: 
        algorithm: scrypt
      setPasswordHashingRateLimit: 
        internalLimit:
          burst: 10
          inverseRate: 0
        ipAddrLimit:
          burst: 5
          inverseRate: 300000000
        ipAddressExceptions: []
        ipv4CidrBlock: 32
        ipv6CidrBlock: 64
        maxRateLimitedKeys: 100000
        userLimit:
          burst: 5
          inverseRate: 60000000
      setChallengeTTL: 604800
      setEphemeralUserCreationEnabled: true
      setConsumableNotifications: false
      setSsoIdpChangeDetectionInputs:
        multiIngressDomainConfigs: {}
        idpCertFingerprintAllowlist: []
