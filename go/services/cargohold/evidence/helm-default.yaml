            mountPath: /etc/wire/cannon/externalHost
          - name: cannon-config
            mountPath: /etc/wire/cannon/conf
        ports:
          - name: http
            containerPort: 8080
        readinessProbe:
          httpGet:
            path: /i/status
            port: 8080
            scheme: HTTP
        livenessProbe:
          initialDelaySeconds: 30
          timeoutSeconds: 1
          httpGet:
            path: /i/status
            port: 8080
            scheme: HTTP
        resources:
          limits:
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 256Mi
      initContainers:
      - name: cannon-configurator
        image: "alpine:3.24.1"
        imagePullPolicy: "IfNotPresent"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          runAsUser: 65534
        command:
        - /bin/sh
        args:
        - -c
        # e.g. cannon-0.cannon.production
        - echo "${HOSTNAME}.cannon.default" > /etc/wire/cannon/externalHost/host.txt
        volumeMounts:
        - name: empty
          mountPath: /etc/wire/cannon/externalHost
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
      - name: cannon-config
        configMap:
          name: cannon
      - name: empty
        emptyDir: {}
